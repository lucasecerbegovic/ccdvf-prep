<meta charset="utf-8">
<title>CCAR-F Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: test-centre console — a slim top rail, one working column, the exam blueprint (5 weighted domains, 6 scenarios) as the recurring visual motif. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e8ecf0; --line:#d5dce3; --ink:#14202b; --muted:#5a6876;
  --accent:#1f4fd6; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --good:#11845b; --good-soft:#dff3ea; --bad:#c2372f; --bad-soft:#fbe5e3; --warn:#a86a00; --warn-soft:#fbefd6;
  --flag:#c77700;
  --d-D1:#1f4fd6; --d-D2:#2f7d32; --d-D3:#7a3fd1; --d-D4:#c2531f; --d-D5:#0f8a8a;
  --f-display:"Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --f-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --sunk:#1b252f; --line:#2a3642; --ink:#e6edf3; --muted:#93a1ae;
  --accent:#7c9dff; --accent-ink:#0b1220; --accent-soft:#1c2a4d;
  --good:#4cc792; --good-soft:#143326; --bad:#ff7b72; --bad-soft:#3a1b1a; --warn:#e3a33b; --warn-soft:#3a2c12; --flag:#f0a23a;
  --d-D1:#7c9dff; --d-D2:#6cc070; --d-D3:#b48cff; --d-D4:#f08a5a; --d-D5:#4fc4c4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --sunk:#1b252f; --line:#2a3642; --ink:#e6edf3; --muted:#93a1ae;
  --accent:#7c9dff; --accent-ink:#0b1220; --accent-soft:#1c2a4d;
  --good:#4cc792; --good-soft:#143326; --bad:#ff7b72; --bad-soft:#3a1b1a; --warn:#e3a33b; --warn-soft:#3a2c12; --flag:#f0a23a;
  --d-D1:#7c9dff; --d-D2:#6cc070; --d-D3:#b48cff; --d-D4:#f08a5a; --d-D5:#4fc4c4;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.3rem;font-weight:700} h3{font-size:1.02rem;font-weight:700}
p{margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:4px}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;align-items:center;gap:18px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;display:flex;gap:8px;align-items:center;white-space:nowrap}
.brand b{background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-size:.72rem;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
nav.tabs a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.countdown{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.countdown strong{color:var(--ink)}
main{padding-block:28px 64px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.86rem} .mono{font-family:var(--f-mono)} .num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
/* blueprint bar */
.blueprint{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:2px}
.blueprint span{display:block;height:100%}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.bignum{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
/* domain readiness rows */
.drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,.9fr) 44px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.drow:last-child{border-bottom:0}
.dname{display:flex;gap:8px;align-items:center;min-width:0;font-weight:600;font-size:.9rem}
.dname span.t{line-height:1.25}
.track{position:relative;height:8px;background:var(--sunk);border-radius:4px}
.track i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.track .cut{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
/* tasks */
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem;color:var(--accent-ink)}
.check.on{background:var(--good);border-color:var(--good)}
.task .body{flex:1;min-width:0}
.task .title{font-weight:600}
/* plan */
.day{display:grid;grid-template-columns:86px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.day.today{background:var(--accent-soft);margin:0 -20px;padding:12px 20px}
.day .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.day .when b{display:block;font-family:var(--f-display);font-size:1.05rem;color:var(--ink)}
/* lessons */
.lcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lcard:hover{border-color:var(--muted)}
.lesson h1{font-size:1.7rem}
.lesson ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:7px}
.lesson li{max-width:75ch}
.trap{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0}
pre.code{font-family:var(--f-mono);font-size:.82rem;line-height:1.5;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0;white-space:pre}
.codewrap{position:relative;min-width:0}
.codewrap .lang{position:absolute;top:6px;right:10px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);text-transform:uppercase}
/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
select,input[type=date],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.picks button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* exam runner */
.runner{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:start}
@media (max-width:860px){.runner{grid-template-columns:1fr}}
.examhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);color:var(--surface);border-radius:var(--r);padding:10px 16px}
.examhead .ttl{font-weight:700;flex:1;min-width:140px}
.timer{font-family:var(--f-mono);font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:#ffb4ab}
.qnum{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.stem{font-size:1.04rem;max-width:78ch;white-space:pre-line}
.selinfo{font-weight:700;font-size:.85rem;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--muted)}
.opt .k{font-family:var(--f-mono);font-weight:600;width:24px;height:24px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none;font-size:.78rem}
.opt.multi .k{border-radius:5px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .txt{flex:1;min-width:0}
.opt .why{display:block;margin-top:6px;font-size:.88rem;color:var(--muted)}
.opt.correct .why,.opt.wrong .why{color:var(--ink)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.navgrid button{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--f-mono);font-size:.75rem;cursor:pointer;position:relative;padding:0}
.navgrid button.ans{background:var(--sunk);border-color:var(--muted)}
.navgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.navgrid button.flag::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.navgrid button.ok{background:var(--good-soft);border-color:var(--good)} .navgrid button.no{background:var(--bad-soft);border-color:var(--bad)}
.scn{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:2px}
.feedback{padding:12px 14px;border-radius:8px;font-weight:600}
.feedback.good{background:var(--good-soft);color:var(--good)} .feedback.bad{background:var(--bad-soft);color:var(--bad)}
/* score dial */
.dial{width:100%;max-width:260px}
.dial text{fill:var(--ink);font-family:var(--f-display)}
.dial .lbl{fill:var(--muted);font-family:var(--f-mono);font-size:9px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20}
.notice{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:.9rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="rail">
  <div class="wrap">
    <div class="brand"><b>CCAR-F</b> Prep</div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#today">Today</a><a href="#plan">Plan</a><a href="#lessons">Lessons</a><a href="#practice">Practice</a><a href="#exams">Exams</a><a href="#review">Review</a><a href="#cram">Cram sheet</a>
    </nav>
    <div class="countdown" id="countdown"></div>
  </div>
</header>
<main class="wrap" id="app"><div class="empty">Loading the question bank…</div></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============ constants ============ */
const DAY = 864e5;
const CUT_RAW = 0.70;              // assumed raw % at the 720 cut (Anthropic does not publish it)
const MOCK_MIN = 120, MOCK_N = 60, PER_SCN = 15, SCN_PER_MOCK = 4;
const LEITNER = [1, 3, 7, 14, 30]; // days
const TEMPLATE = [ // 19-step intensive template, heaviest domain first; spread across the days to your exam date
  [{t:"diag"}],
  [{t:"lesson",s:"D1.1"},{t:"lesson",s:"D1.2"},{t:"lesson",s:"D1.3"},{t:"quiz",d:["D1"],n:15}],
  [{t:"lesson",s:"D1.4"},{t:"lesson",s:"D1.5"},{t:"lesson",s:"D1.6"},{t:"lesson",s:"D1.7"},{t:"quiz",d:["D1"],n:15}],
  [{t:"lesson",s:"D3.1"},{t:"lesson",s:"D3.2"},{t:"lesson",s:"D3.3"},{t:"quiz",d:["D3"],n:15}],
  [{t:"lesson",s:"D3.4"},{t:"lesson",s:"D3.5"},{t:"lesson",s:"D3.6"},{t:"quiz",d:["D3"],n:15}],
  [{t:"lesson",s:"D4.1"},{t:"lesson",s:"D4.2"},{t:"lesson",s:"D4.3"},{t:"quiz",d:["D4"],n:15}],
  [{t:"lesson",s:"D4.4"},{t:"lesson",s:"D4.5"},{t:"lesson",s:"D4.6"},{t:"quiz",d:["D4"],n:15},{t:"review"}],
  [{t:"lesson",s:"D2.1"},{t:"lesson",s:"D2.2"},{t:"lesson",s:"D2.3"},{t:"quiz",d:["D2"],n:15}],
  [{t:"lesson",s:"D2.4"},{t:"lesson",s:"D2.5"},{t:"quiz",d:["D1","D2"],n:20}],
  [{t:"lesson",s:"D5.1"},{t:"lesson",s:"D5.2"},{t:"lesson",s:"D5.3"},{t:"quiz",d:["D5"],n:15}],
  [{t:"lesson",s:"D5.4"},{t:"lesson",s:"D5.5"},{t:"lesson",s:"D5.6"},{t:"quiz",d:["D5"],n:15},{t:"review"}],
  [{t:"mock",m:1}],
  [{t:"review"},{t:"quiz",d:[],n:25,weak:true}],
  [{t:"mock",m:2}],
  [{t:"mock",m:3}],
  [{t:"review"},{t:"quiz",d:[],n:30,weak:true}],
  [{t:"mock",m:4}],
  [{t:"mock",m:5},{t:"mock",m:6}],
  [{t:"cram"},{t:"review"}],
];

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const pct = x => Math.round(x * 100) + "%";
const day0 = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const isoDate = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d).getTime(); };
const shortDate = t => new Date(t).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const shuffle = (a, r = Math.random) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const toScaled = raw => Math.round(raw <= CUT_RAW ? 100 + (raw / CUT_RAW) * 620 : 720 + ((raw - CUT_RAW) / (1 - CUT_RAW)) * 280);
const mmss = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h? h+":" : "") + String(m).padStart(2,"0") + ":" + String(x).padStart(2,"0"); };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));

/* ============ state + storage ============ */
let B = null;               // bank
let QM = {};                // qid -> question
let S = null;               // persisted state
let store = { db:null, ref:null, writing:false, pending:false, timer:null, status:"local" };

function freshState(){
  const start = day0(Date.now());
  return { v:1, startDate:start, examDate:start + 19*DAY, qstats:{}, attempts:[], lessonsDone:{}, done:{}, active:null, mocks:{}, updatedAt:0 };
}
function loadLocal(){ try { const s = localStorage.getItem("ccarf-state"); return s ? JSON.parse(s) : null; } catch { return null; } }
function saveLocal(){ try { localStorage.setItem("ccarf-state", JSON.stringify(S)); } catch {} }
function save(){
  S.updatedAt = Date.now(); saveLocal();
  if (!store.ref) return;
  clearTimeout(store.timer); store.timer = setTimeout(flush, 1200);
}
async function flush(){
  if (!store.ref) return;
  if (store.writing){ store.pending = true; return; }
  store.writing = true;
  try { await store.ref.set(JSON.parse(JSON.stringify(S))); store.status = "synced"; }
  catch (e) { if (e && e.code === "invalid_argument") { store.ref = null; store.status = "local"; } else store.status = "offline"; }
  store.writing = false; renderCountdown();
  if (store.pending){ store.pending = false; flush(); }
}
async function connectStore(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/ccarf");
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), 10000))]);
    store.ref = ref; store.status = "synced";
    if (snap.exists) {
      const remote = snap.data();
      if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(freshState(), JSON.parse(JSON.stringify(remote))); saveLocal(); route(); }
      else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) flush();
    } else if (S.updatedAt) flush();
    renderCountdown();
  } catch (e) { store.status = "offline"; renderCountdown(); }
}

/* ============ derived data ============ */
const dom = c => B.domains.find(d => d.code === c);
const sub = c => B.subskills.find(s => s.code === c);
const domOf = q => q.subskill.split(".")[0];
const scn = c => B.scenarios.find(x => x.code === c);
function sealedIndex(m){ return m - 3; } // mocks 3..6 are sealed
function completedMocks(){ return new Set(S.attempts.filter(a => a.kind === "mock").map(a => a.mock)); }
function practicePool(){
  const pool = new Set(B.practicePool);
  const done = completedMocks();
  B.sealedMocks.forEach((blocks, i) => { if (done.has(i + 3)) blocks.forEach(b => b.ids.forEach(id => pool.add(id))); });
  return [...pool];
}
function ssStats(){
  const out = {}; B.subskills.forEach(s => out[s.code] = {n:0, c:0});
  for (const [qid, st] of Object.entries(S.qstats)) { const q = QM[qid]; if (!q) continue; const o = out[q.subskill]; o.n += 1; o.c += st.last; }
  return out;
}
function readiness(){
  const st = ssStats(); let answered = 0;
  const ssAcc = {}; for (const s of B.subskills) { const o = st[s.code]; answered += o.n; ssAcc[s.code] = (o.c + 1) / (o.n + 2); }
  const dAcc = {}, dN = {};
  for (const d of B.domains) {
    const subs = B.subskills.filter(s => s.domain === d.code); const w = subs.reduce((a, s) => a + s.weight, 0);
    dAcc[d.code] = subs.reduce((a, s) => a + ssAcc[s.code] * s.weight, 0) / w;
    dN[d.code] = subs.reduce((a, s) => a + st[s.code].n, 0);
  }
  const raw = B.subskills.reduce((a, s) => a + ssAcc[s.code] * s.weight, 0) / 100;
  return { answered, ssAcc, dAcc, dN, raw, scaled: toScaled(raw) };
}
function weakestSubskills(k){
  const r = readiness();
  // priority = expected points lost on the real exam = (1 - accuracy) * weight
  const pr = s => (1 - r.ssAcc[s.code]) * s.weight;
  return B.subskills.slice().sort((a, b) => pr(b) - pr(a)).slice(0, k).map(s => s.code);
}
function dueIds(){
  const now = Date.now();
  return Object.entries(S.qstats).filter(([id, st]) => QM[id] && st.due && st.due <= now).map(([id]) => id);
}
function missedIds(){ return Object.entries(S.qstats).filter(([id, st]) => QM[id] && st.last === 0).map(([id]) => id); }

/* ============ plan ============ */
function planDays(){
  const n = Math.max(1, Math.round((S.examDate - S.startDate) / DAY));
  const days = Array.from({length:n}, (_, i) => ({ i, date: S.startDate + i*DAY, tasks: [] }));
  TEMPLATE.forEach((tasks, ti) => {
    const di = Math.min(n - 1, Math.floor(ti * n / TEMPLATE.length));
    tasks.forEach((t, k) => days[di].tasks.push(Object.assign({key:`t${ti}-${k}`}, t)));
  });
  return days;
}
function taskDone(t){
  if (t.t === "lesson") return !!S.lessonsDone[t.s];
  if (t.t === "diag") return S.attempts.some(a => a.kind === "diag");
  if (t.t === "mock") return completedMocks().has(t.m);
  return !!S.done[t.key];
}
function taskLabel(t){
  if (t.t === "lesson") { const s = sub(t.s); return { title:`Lesson · ${s.name}`, meta:`${t.s} · ${s.weight}% of exam · ~10 min` }; }
  if (t.t === "diag") return { title:"Diagnostic test", meta:`${B.diagnostic.length} questions, one per task statement · untimed · sets your focus areas` };
  if (t.t === "mock") return { title:`Mock exam ${t.m}`, meta:`${MOCK_N} questions · ${SCN_PER_MOCK} scenarios · ${MOCK_MIN} min` + (t.m <= 2 ? " · drawn from practice bank" : " · sealed set") };
  if (t.t === "quiz") return { title: t.weak ? `Targeted quiz · your weakest task statements` : `Practice quiz · ${t.d.map(d => dom(d).name).join(", ")}`, meta:`${t.n} questions · instant feedback` };
  if (t.t === "review") return { title:"Spaced review", meta:"Questions due for review and recent misses" };
  if (t.t === "cram") return { title:"Read the cram sheet", meta:"Every exam trap on one page · 30 min" };
}
function taskAction(t){
  if (t.t === "lesson") return `<a class="btn" href="#lesson-${t.s.replace(".","-")}">Open</a>`;
  if (t.t === "diag") return `<button class="btn primary" data-act="diag">Start</button>`;
  if (t.t === "mock") return `<button class="btn primary" data-act="mock" data-m="${t.m}">Start</button>`;
  if (t.t === "quiz") return `<button class="btn" data-act="quiz" data-key="${t.key}" data-d="${t.d.join(",")}" data-n="${t.n}" data-weak="${t.weak?1:""}">Start</button>`;
  if (t.t === "review") return `<button class="btn" data-act="review" data-key="${t.key}">Start</button>`;
  if (t.t === "cram") return `<a class="btn" href="#cram" data-act="cramdone" data-key="${t.key}">Open</a>`;
}
function taskRow(t){
  const d = taskDone(t), l = taskLabel(t);
  return `<div class="task"><span class="check ${d?"on":""}" aria-label="${d?"Done":"Not done"}">${d?"✓":""}</span>
    <div class="body"><div class="title">${esc(l.title)}</div><div class="small muted">${esc(l.meta)}</div></div>${d && t.t!=="lesson" ? `<span class="chip good">Done</span>` : taskAction(t)}</div>`;
}

/* ============ selection ============ */
function pickPractice({domains = [], subskills = [], scenarios = [], n = 15, source = "smart", weak = false}){
  let pool = practicePool();
  if (scenarios.length) pool = pool.filter(id => scenarios.includes(QM[id].scenario));
  if (weak) subskills = weakestSubskills(6);
  if (subskills.length) pool = pool.filter(id => subskills.includes(QM[id].subskill));
  else if (domains.length) pool = pool.filter(id => domains.includes(domOf(QM[id])));
  const now = Date.now();
  if (source === "unseen") pool = pool.filter(id => !S.qstats[id]);
  if (source === "missed") pool = pool.filter(id => S.qstats[id] && S.qstats[id].last === 0);
  if (source === "due") pool = pool.filter(id => S.qstats[id] && S.qstats[id].due <= now);
  const score = id => { const st = S.qstats[id]; if (!st) return 1 + Math.random(); if (st.last === 0) return 2 + Math.random(); if (st.due <= now) return 1.5 + Math.random(); return Math.random() * 0.5; };
  return pool.sort((a, b) => score(b) - score(a)).slice(0, n);
}
function buildDrawnMock(){
  const pool = practicePool(); const seen = id => S.qstats[id] ? 1 : 0;
  const fresh = c => pool.filter(id => QM[id].scenario === c && !seen(id)).length;
  const scs = shuffle(B.scenarios.map(x => x.code)).sort((a, b) => fresh(b) - fresh(a)).slice(0, SCN_PER_MOCK);
  const counts = {}; B.domains.forEach(d => counts[d.code] = 0); const blocks = []; let total = 0;
  for (const c of shuffle(scs)) {
    let avail = shuffle(pool.filter(id => QM[id].scenario === c)); const out = [];
    while (out.length < PER_SCN && avail.length) {
      const n = total + 1, need = id => dom(domOf(QM[id])).weight / 100 * n - counts[domOf(QM[id])] - seen(id) * 2;
      const best = avail.reduce((x, y) => need(y) > need(x) ? y : x);
      out.push(best); avail = avail.filter(x => x !== best); counts[domOf(QM[best])]++; total++;
    }
    blocks.push(shuffle(out));
  }
  return blocks.flat();
}
function orderForExam(blocks){ return shuffle(blocks).flatMap(b => shuffle(b.ids)); }

/* ============ attempts ============ */
function startAttempt({kind, label, ids, timed = false, feedback = false, mock = null, key = null}){
  if (!ids.length) { toast("No questions match those filters yet."); return; }
  S.active = { kind, label, ids, idx:0, answers:{}, flags:[], checked:{}, feedback, mock, key,
    startedAt: Date.now(), endsAt: timed ? Date.now() + MOCK_MIN*60e3 : null, reviewScreen:false, confirm:false };
  save(); location.hash = "run"; route();
}
function finishAttempt(){
  const a = S.active; if (!a) return;
  const byDomain = {}; B.domains.forEach(d => byDomain[d.code] = [0, 0]);
  let correct = 0; const now = Date.now();
  for (const id of a.ids) {
    const q = QM[id]; const got = a.answers[id] || []; const ok = sameSet(got, q.answer);
    if (ok) correct++; byDomain[domOf(q)][1]++; if (ok) byDomain[domOf(q)][0]++;
    const st = S.qstats[id] || { n:0, c:0, box:0, due:0, last:0 };
    st.n++; if (ok) st.c++; st.last = ok ? 1 : 0;
    st.box = ok ? Math.min(LEITNER.length - 1, st.box + (st.n === 1 ? 2 : 1)) : 0;
    st.due = now + LEITNER[st.box] * DAY; S.qstats[id] = st;
  }
  const raw = correct / a.ids.length;
  const att = { id: "a" + now, kind: a.kind, label: a.label, mock: a.mock, at: now, dur: Math.round((now - a.startedAt)/1000),
    ids: a.ids, answers: a.answers, flags: a.flags, correct, total: a.ids.length, raw, scaled: toScaled(raw), byDomain };
  S.attempts.push(att);
  if (a.key) S.done[a.key] = true;
  // keep answer detail for the last 80 attempts only (document size)
  if (S.attempts.length > 80) S.attempts.slice(0, S.attempts.length - 80).forEach(x => { delete x.answers; delete x.ids; delete x.flags; });
  S.active = null; save();
  location.hash = "result-" + att.id; route();
}

/* ============ rendering: shared bits ============ */
function blueprintBar(){ return `<div class="blueprint" aria-label="Exam blueprint by domain weight">${B.domains.map(d => `<span title="${esc(d.name)} ${d.weight}%" style="flex:${d.weight};background:var(--d-${d.code})"></span>`).join("")}</div>`; }
function dial(score, label){
  const a0 = Math.PI * 0.85, a1 = Math.PI * 2.15; const pos = v => a0 + (a1 - a0) * (v - 100) / 900;
  const pt = (ang, r) => [100 + r*Math.cos(ang), 100 + r*Math.sin(ang)];
  const arc = (from, to, r) => { const [x1,y1] = pt(pos(from), r), [x2,y2] = pt(pos(to), r); const large = (pos(to) - pos(from)) > Math.PI ? 1 : 0; return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const v = score == null ? null : Math.max(100, Math.min(1000, score));
  const [cx, cy] = pt(pos(720), 86), [cx2, cy2] = pt(pos(720), 66), [lx, ly] = pt(pos(720), 58);
  return `<svg class="dial" viewBox="0 0 200 170" role="img" aria-label="${label}: ${v ?? "no data"} on the 100 to 1000 scale, pass mark 720">
    <path d="${arc(100, 1000, 76)}" fill="none" stroke="var(--sunk)" stroke-width="14" stroke-linecap="round"/>
    ${v != null ? `<path d="${arc(100, v, 76)}" fill="none" stroke="${v >= 720 ? "var(--good)" : "var(--accent)"}" stroke-width="14" stroke-linecap="round"/>` : ""}
    <line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${cx2.toFixed(1)}" y2="${cy2.toFixed(1)}" stroke="var(--ink)" stroke-width="2"/>
    <text class="lbl" x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle">720</text>
    <text x="100" y="104" text-anchor="middle" font-size="36" font-weight="700">${v ?? "—"}</text>
    <text class="lbl" x="100" y="122" text-anchor="middle">${esc(label)}</text>
    <text class="lbl" x="42" y="160" text-anchor="middle">100</text><text class="lbl" x="158" y="160" text-anchor="middle">1000</text>
  </svg>`;
}
function domainRows(acc, counts){
  return B.domains.map(d => {
    const v = acc[d.code]; const n = counts ? counts[d.code] : null;
    return `<div class="drow"><div class="dname"><span class="dot" style="background:var(--d-${d.code})"></span><span class="t">${esc(d.name)}</span><span class="small muted num">${d.weight}%</span></div>
      <div class="track" title="${v==null?"":pct(v)}"><i style="width:${v==null?0:Math.round(v*100)}%;background:var(--d-${d.code})"></i><span class="cut" style="left:${CUT_RAW*100}%"></span></div>
      <div class="num small" style="text-align:right">${v==null||(counts&&!n)?"—":pct(v)}</div></div>`;
  }).join("");
}
function renderCountdown(){
  if (!S) return;
  const days = Math.round((day0(S.examDate) - day0(Date.now())) / DAY);

function vExams(){
  const done = completedMocks(); const diag = S.attempts.filter(a => a.kind === "diag").slice(-1)[0];
  const mockCard = m => { const at = S.attempts.filter(a => a.kind === "mock" && a.mock === m); const best = at.length ? Math.max(...at.map(a => a.scaled)) : null;
    return `<div class="panel stack" style="gap:8px"><div class="row" style="justify-content:space-between"><h3>Mock exam ${m}</h3>${best!=null ? (best>=720?`<span class="chip good">${best}</span>`:`<span class="chip bad">${best}</span>`) : `<span class="chip">Not taken</span>`}</div>
      <p class="small muted">${m <= 2 ? `${SCN_PER_MOCK} scenarios drawn at start from the practice bank, favouring questions you haven't seen.` : `Sealed set of ${MOCK_N} questions across ${SCN_PER_MOCK} scenarios that you won't see anywhere else until you take it.`}</p>
      <div class="row">${S.active ? `<button class="btn" disabled>Finish current attempt first</button>` : `<button class="btn ${done.has(m)?"":"primary"}" data-act="mock" data-m="${m}">${done.has(m) ? "Retake" : "Start"}</button>`}${at.length ? `<a class="btn ghost" href="#result-${at[at.length-1].id}">Last result</a>` : ""}</div></div>`; };
  const hist = S.attempts.slice().reverse();
  return `<div class="stack">
    <div class="stack" style="gap:6px"><div class="eyebrow">Exams</div><h1>Diagnostic and mock exams</h1>
      <p class="muted" style="max-width:72ch">Mocks run under exam conditions: ${MOCK_N} questions grouped under ${SCN_PER_MOCK} of the 6 exam scenarios (${PER_SCN} each), close to the official domain weights, a ${MOCK_MIN}-minute timer that keeps running if you leave, flag for review, and no feedback until you submit. Scores use the 100–1000 scale with 720 to pass.</p></div>
    <div class="panel row" style="justify-content:space-between;align-items:center"><div class="stack" style="gap:4px"><h3>Diagnostic</h3><p class="small muted">${B.diagnostic.length} questions, one per task statement. Untimed, no feedback until the end.</p></div>
      <div class="row">${diag ? `<span class="chip acc">${diag.correct}/${diag.total}</span><a class="btn ghost" href="#result-${diag.id}">Result</a>` : ""}<button class="btn ${diag?"":"primary"}" data-act="diag" ${S.active?"disabled":""}>${diag?"Retake":"Start"}</button></div></div>
    <div class="grid3">${[1,2,3,4,5,6].map(mockCard).join("")}</div>
    <section class="panel stack" style="gap:10px"><h2>History</h2>${hist.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Attempt</th><th>Score</th><th>Scaled</th><th>Time</th><th></th></tr></thead><tbody>${hist.map(a => `<tr><td>${shortDate(a.at)}</td><td>${esc(a.label)}</td><td class="num">${a.correct}/${a.total} (${pct(a.raw)})</td><td class="num">${a.kind==="mock"?`<strong>${a.scaled}</strong>`:"—"}</td><td class="num">${mmss(a.dur)}</td><td>${a.ids?`<a href="#result-${a.id}">Review</a>`:""}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No attempts yet.</p>`}</section>
  </div>`;
}

function vReview(){
  const due = dueIds(), missed = missedIds();
  const bySS = {}; missed.forEach(id => { const s = QM[id].subskill; bySS[s] = (bySS[s]||0) + 1; });
  return `<div class="stack">
    <div class="stack" style="gap:6px"><div class="eyebrow">Spaced review</div><h1>Mistakes and reviews</h1><p class="muted" style="max-width:70ch">Each question moves through review intervals of ${LEITNER.join(", ")} days. A miss sends it back to the start.</p></div>
    <div class="grid2">
      <section class="panel stack" style="gap:10px"><div class="bignum num">${due.length}</div><p>due for review now</p><div><button class="btn primary" data-act="review" ${due.length?"":"disabled"}>Review ${Math.min(30, due.length)}</button></div></section>
      <section class="panel stack" style="gap:10px"><div class="bignum num">${missed.length}</div><p>currently missed (last attempt wrong)</p><div><button class="btn" data-act="missed" ${missed.length?"":"disabled"}>Retry missed</button></div></section>
    </div>
    <section class="panel stack" style="gap:10px"><h2>Mistakes log by task statement</h2>${Object.keys(bySS).length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Task statement</th><th>Missed</th><th></th></tr></thead><tbody>${Object.entries(bySS).sort((a,b)=>b[1]-a[1]).map(([s,n]) => `<tr><td><span class="dot" style="background:var(--d-${s.split(".")[0]})"></span> ${esc(sub(s).name)} <span class="muted small">${s}</span></td><td class="num">${n}</td><td><a href="#lesson-${s.replace(".","-")}">Lesson</a> · <a href="#" data-act="quizss" data-s="${s}" data-src="missed">Retry</a></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Nothing missed yet.</p>`}</section>
  </div>`;
}

function vCram(){
  return `<div class="stack" style="max-width:900px">
    <div class="stack" style="gap:6px"><div class="eyebrow">Final-day cram sheet</div><h1>Every exam trap, by weight</h1><p class="muted">Read top to bottom. Domains run from heaviest to lightest.</p></div>
    <section class="panel stack" style="gap:8px"><h3>Exam facts</h3><ul style="margin:0;padding-left:1.2em">
      <li>${MOCK_N} questions · ${MOCK_MIN} minutes = <strong>2 minutes per question</strong>. Flag anything over 3 minutes and move on.</li>
      <li>You get <strong>${SCN_PER_MOCK} of the 6 scenarios</strong> at random, about ${PER_SCN} questions each. Read each scenario carefully once: its constraints decide the close calls.</li>
      <li>Multi-response items say how many to pick ("Select TWO"). No partial credit.</li>
      <li>Scaled 100–1000, pass at <strong>720</strong>. That isn't 72% correct. Your report shows percent correct per domain.</li>
      <li>Agentic Architecture & Orchestration is over a quarter of the exam (≈16 questions). When a rule must always hold, the answer is usually a deterministic control (hook, code, tool gating), not a stronger prompt.</li></ul></section>
    ${B.domains.map(d => { const ls = B.lessons.filter(l => l.subskill.split(".")[0] === d.code); if (!ls.length) return "";
      return `<section class="stack" style="gap:10px"><h2 class="row" style="gap:10px;align-items:center"><span class="dot" style="background:var(--d-${d.code});width:12px;height:12px"></span>${esc(d.name)} <span class="muted small num">${d.weight}%</span></h2>
      ${ls.map(l => `<div class="panel stack" style="gap:8px"><h3>${esc(sub(l.subskill).name)} <span class="muted small mono">${l.subskill}</span></h3>${(l.traps||[]).map(t => `<div class="trap small">${fmt(t)}</div>`).join("")}</div>`).join("")}</section>`; }).join("")}
  </div>`;
}

/* ---------- runner ---------- */
function scnCard(q, a){
  const x = scn(q.scenario); if (!x) return "";
  let pos = "";
  if (a && a.kind === "mock") { const order = [...new Set(a.ids.map(id => QM[id].scenario))]; pos = ` · ${order.indexOf(q.scenario) + 1} of ${order.length}`; }
  return `<div class="scn"><div class="eyebrow">Scenario${pos}</div><strong>${esc(x.name)}</strong><p class="small muted">${esc(x.desc)}</p></div>`;
}
let tick = null;
function vRun(){
  const a = S.active; if (!a) return `<div class="empty">No attempt in progress. <a href="#exams">Exams</a> · <a href="#practice">Practice</a></div>`;
  if (a.endsAt && Date.now() >= a.endsAt) { setTimeout(finishAttempt, 0); return `<div class="empty">Time is up. Scoring…</div>`; }
  const timed = !!a.endsAt;
  const answered = a.ids.filter(id => (a.answers[id]||[]).length).length;
  const head = `<div class="examhead"><span class="ttl">${esc(a.label)}</span><span class="small num">${answered}/${a.ids.length} answered</span>${timed ? `<span class="timer" id="timer">${mmss((a.endsAt - Date.now())/1000)}</span>` : ""}</div>`;
  const grid = `<div class="navgrid">${a.ids.map((id, i) => { const ans = (a.answers[id]||[]).length; let cls = ans ? "ans" : ""; if (a.feedback && a.checked[id]) cls = sameSet(a.answers[id]||[], QM[id].answer) ? "ok" : "no"; return `<button class="${cls} ${i===a.idx && !a.reviewScreen?"cur":""} ${a.flags.includes(id)?"flag":""}" data-go="${i}" aria-label="Question ${i+1}">${i+1}</button>`; }).join("")}</div>`;
  if (a.reviewScreen) {
    const un = a.ids.filter(id => !(a.answers[id]||[]).length).length;
    return `<div class="stack">${head}<section class="panel stack" style="gap:14px"><h2>Review before submitting</h2>
      <p>${un ? `<strong>${un}</strong> unanswered` : "All questions answered"} · <strong>${a.flags.length}</strong> flagged. Select a number to go back to it.</p>${grid}
      <div class="row">${a.confirm ? `<span>Submit now? You can't change answers after this.</span><button class="btn primary" data-act="submit">Yes, submit</button><button class="btn" data-act="unconfirm">Cancel</button>` : `<button class="btn primary" data-act="confirm">Submit ${a.kind==="mock"?"exam":"answers"}</button><button class="btn" data-go="${a.idx}">Return to questions</button>`}</div>
      ${a.kind !== "mock" ? `<div class="row"><button class="btn ghost danger" data-act="abandon">Discard this attempt</button></div>` : ""}</section></div>`;
  }
  const id = a.ids[a.idx], q = QM[id], sel = a.answers[id] || [], multi = q.select > 1, checked = a.feedback && a.checked[id];
  const word = ["","ONE","TWO","THREE","FOUR"][q.select];
  const opts = q.options.map((o, i) => { const on = sel.includes(i); let cls = multi ? "multi" : "";
    if (checked) cls += q.answer.includes(i) ? " correct" : on ? " wrong" : "";
    return `<button class="opt ${cls}" role="${multi?"checkbox":"radio"}" aria-checked="${on}" data-opt="${i}" ${checked?"disabled":""}><span class="k">${"ABCDEF"[i]}</span><span class="txt">${fmt(o)}${checked ? `<span class="why">${fmt(q.explanations[i])}</span>` : ""}</span></button>`; }).join("");
  const ok = checked && sameSet(sel, q.answer);
  const last = a.idx === a.ids.length - 1;
  return `<div class="stack">${head}<div class="runner">
    <section class="panel stack" style="gap:16px">
      <div class="row" style="justify-content:space-between;align-items:center"><span class="qnum">Question ${a.idx+1} of ${a.ids.length}${a.kind!=="mock"?` · ${q.subskill} ${esc(sub(q.subskill).name)}`:""}</span>
        <button class="btn ghost small" data-act="flag" aria-pressed="${a.flags.includes(id)}">${a.flags.includes(id) ? "⚑ Flagged" : "⚐ Flag for review"}</button></div>
      ${scnCard(q, a)}<p class="stem">${fmt(q.stem)}</p>${codeBlock(q.code)}
      ${multi ? `<p class="selinfo">Select ${word}.</p>` : ""}
      <div class="opts" role="${multi?"group":"radiogroup"}">${opts}</div>
      ${checked ? `<div class="feedback ${ok?"good":"bad"}">${ok ? "Correct." : `Incorrect. The answer is ${q.answer.map(i => "ABCDEF"[i]).join(" and ")}.`}${q.ref ? ` <a href="${esc(q.ref)}" target="_blank" rel="noopener" class="small">Docs</a>` : ""}</div>` : ""}
      <div class="row" style="justify-content:space-between">
        <button class="btn" data-go="${a.idx-1}" ${a.idx===0?"disabled":""}>← Previous</button>
        <div class="row">${a.feedback && !checked ? `<button class="btn primary" data-act="check" ${sel.length===q.select?"":"disabled"}>Check answer</button>` : ""}
          ${last ? `<button class="btn ${a.feedback && !checked ? "" : "primary"}" data-act="reviewscreen">${a.kind==="mock"?"Review & submit":"Finish"}</button>` : `<button class="btn ${a.feedback && !checked ? "" : "primary"}" data-go="${a.idx+1}">Next →</button>`}</div>
      </div>
    </section>
    <aside class="panel stack" style="gap:10px"><div class="eyebrow">Questions</div>${grid}<div class="small muted">Shaded = answered · dot = flagged</div><button class="btn" data-act="reviewscreen">Review screen</button></aside>
  </div></div>`;
}

function vResult(id){
  const a = S.attempts.find(x => x.id === id); if (!a) return `<div class="empty">Result not found. <a href="#exams">Exams</a></div>`;
  const acc = {}; const counts = {}; for (const [d, [c, t]] of Object.entries(a.byDomain)) { acc[d] = t ? c/t : null; counts[d] = t; }
  const isMock = a.kind === "mock";
  const items = a.ids ? a.ids.map((qid, i) => { const q = QM[qid]; if (!q) return ""; const got = (a.answers||{})[qid] || []; const ok = sameSet(got, q.answer);
    return `<details class="panel" ${ok?"":""}><summary class="row" style="gap:10px;align-items:center;cursor:pointer"><span class="chip ${ok?"good":"bad"}">${ok?"Correct":"Missed"}</span><span class="mono small muted">Q${i+1} · ${q.scenario} · ${q.subskill}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.stem.slice(0, 110))}</span></summary>
      <div class="stack" style="gap:12px;margin-top:14px">${scnCard(q)}<p class="stem">${fmt(q.stem)}</p>${codeBlock(q.code)}<div class="opts">${q.options.map((o, k) => `<div class="opt ${q.select>1?"multi":""} ${q.answer.includes(k)?"correct":got.includes(k)?"wrong":""}"><span class="k">${"ABCDEF"[k]}</span><span class="txt">${fmt(o)}<span class="why">${fmt(q.explanations[k])}</span></span></div>`).join("")}</div>
      <div class="small">${got.length ? `You chose ${got.map(k => "ABCDEF"[k]).join(", ")}.` : "Not answered."} ${q.ref ? `<a href="${esc(q.ref)}" target="_blank" rel="noopener">Docs</a> · ` : ""}<a href="#lesson-${q.subskill.replace(".","-")}">Lesson</a></div></div></details>`; }).join("") : `<p class="muted">Answer details for this older attempt were trimmed to save space.</p>`;
  return `<div class="stack">
    <div class="stack" style="gap:6px"><div class="eyebrow">${shortDate(a.at)} · ${mmss(a.dur)} taken</div><h1>${esc(a.label)}</h1></div>
    <div class="hero">
      <section class="panel stack" style="align-items:center;text-align:center;gap:8px">
        ${isMock ? dial(a.scaled, "scaled score") : `<div class="bignum num">${a.correct}/${a.total}</div>`}
        ${isMock ? `<p>${a.scaled >= 720 ? `<span class="chip good">PASS</span>` : `<span class="chip bad">FAIL</span>`} <span class="num">${a.correct}/${a.total} correct (${pct(a.raw)})</span></p><p class="small muted">Estimated scaling: ${Math.round(CUT_RAW*100)}% correct ≈ 720.</p>` : `<p class="muted">${pct(a.raw)} correct</p>`}
      </section>
      <section class="panel stack" style="gap:8px"><h2>Percent correct by domain</h2><div>${domainRows(acc, counts)}</div></section>
    </div>
    <div class="row"><a class="btn primary" href="#today">Back to today</a>${a.correct < a.total ? `<button class="btn" data-act="retryattempt" data-id="${a.id}">Retry the ${a.total - a.correct} missed</button>` : ""}</div>
    <section class="stack" style="gap:10px"><h2>Question review</h2>${items}</section>
  </div>`;
}

/* ============ router ============ */
function route(){
  if (!B || !S) return;
  clearInterval(tick); tick = null;
  const h = (location.hash || "#today").slice(1);
  const top = h.startsWith("lesson-") ? "lessons" : h.startsWith("result-") || h === "run" ? "exams" : h;
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + top ? "page" : "false"));
  let html;
  if (h === "plan") html = vPlan();
  else if (h === "lessons") html = vLessons();
  else if (h.startsWith("lesson-")) html = vLesson(h.slice(7).replace("-", "."));
  else if (h === "practice") html = vPractice();
  else if (h === "exams") html = vExams();
  else if (h === "review") html = vReview();
  else if (h === "cram") html = vCram();
  else if (h === "run") html = vRun();
  else if (h.startsWith("result-")) html = vResult(h.slice(7));
  else html = vToday();
  $("#app").innerHTML = html;
  renderCountdown();
  if (h === "run" && S.active && S.active.endsAt) tick = setInterval(() => {
    const el = $("#timer"); const left = (S.active.endsAt - Date.now())/1000;
    if (left <= 0) { clearInterval(tick); finishAttempt(); return; }
    if (el) { el.textContent = mmss(left); el.classList.toggle("low", left < 600); }
  }, 1000);
}
function rerunKeepScroll(){ const y = scrollY; route(); scrollTo(0, y); }

/* ============ events ============ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-go],[data-opt],[data-pf],[data-pick]"); if (!el || el.disabled) return;
  const a = S.active;
  if (el.dataset.go !== undefined) { const i = +el.dataset.go; if (a && i >= 0 && i < a.ids.length) { a.idx = i; a.reviewScreen = false; a.confirm = false; save(); route(); scrollTo(0,0); } return; }
  if (el.dataset.opt !== undefined) {
    const id = a.ids[a.idx], q = QM[id], i = +el.dataset.opt; let sel = (a.answers[id] || []).slice();
    if (q.select === 1) sel = [i];
    else if (sel.includes(i)) sel = sel.filter(x => x !== i);
    else if (sel.length < q.select) sel.push(i);
    else { toast(`Select ${q.select} answers only. Deselect one first.`); return; }
    a.answers[id] = sel; save(); rerunKeepScroll(); return;
  }
  if (el.dataset.pf) { PF[el.dataset.pf] = el.dataset.v; rerunKeepScroll(); return; }
  if (el.dataset.pick) { const k = el.dataset.pick, v = el.dataset.v; PF[k] = PF[k].includes(v) ? PF[k].filter(x => x !== v) : [...PF[k], v]; if (k === "domains") PF.subskills = PF.subskills.filter(s => !PF.domains.length || PF.domains.includes(s.split(".")[0])); rerunKeepScroll(); return; }
  const act = el.dataset.act;
  const busy = () => { if (S.active) { toast("Finish or submit your current attempt first."); location.hash = "run"; return true; } return false; };
  switch (act) {
    case "diag": if (busy()) return; startAttempt({kind:"diag", label:"Diagnostic test", ids: shuffle(B.diagnostic), feedback:false}); break;
    case "mock": { if (busy()) return; const m = +el.dataset.m; const ids = m <= 2 ? buildDrawnMock() : orderForExam(B.sealedMocks[sealedIndex(m)] || []);
      startAttempt({kind:"mock", label:`Mock exam ${m}`, ids, timed:true, feedback:false, mock:m}); break; }
    case "quiz": { if (busy()) return; const d = (el.dataset.d || "").split(",").filter(Boolean);
      startAttempt({kind:"practice", label: el.dataset.weak ? "Targeted quiz · weakest task statements" : `Practice · ${d.map(x => dom(x).name).join(", ")}`, ids: pickPractice({domains:d, n:+el.dataset.n || 15, weak:!!el.dataset.weak}), feedback:true, key: el.dataset.key || null}); break; }
    case "quizss": { e.preventDefault(); if (busy()) return; const s = el.dataset.s; startAttempt({kind:"practice", label:`Practice · ${sub(s).name}`, ids: pickPractice({subskills:[s], n:10, source: el.dataset.src || "smart"}), feedback:true}); break; }
    case "review": { if (busy()) return; let ids = shuffle(dueIds()).slice(0, 30); if (ids.length < 10) ids = [...new Set([...ids, ...shuffle(missedIds())])].slice(0, 20);
      if (!ids.length) { toast("Nothing is due yet. Answer some questions first."); if (el.dataset.key) { S.done[el.dataset.key] = true; save(); route(); } return; }
      startAttempt({kind:"review", label:"Spaced review", ids, feedback:true, key: el.dataset.key || null}); break; }
    case "missed": if (busy()) return; startAttempt({kind:"review", label:"Retry missed", ids: shuffle(missedIds()).slice(0, 30), feedback:true}); break;
    case "retryattempt": { if (busy()) return; const at = S.attempts.find(x => x.id === el.dataset.id); const ids = at.ids.filter(q => !sameSet((at.answers[q]||[]), QM[q].answer));
      startAttempt({kind:"review", label:`Retry · ${at.label}`, ids, feedback:true}); break; }
    case "startpractice": if (busy()) return; startAttempt({kind:"practice", label:"Custom practice", ids: pickPractice({domains:PF.domains, subskills:PF.subskills, scenarios:PF.scenarios, n:PF.n, source:PF.source}), feedback: PF.feedback === "instant"}); break;
    case "clearpf": PF.domains = []; PF.subskills = []; PF.scenarios = []; route(); break;
    case "lessondone": S.lessonsDone[el.dataset.s] = Date.now(); save(); rerunKeepScroll(); toast("Marked as read"); break;
    case "cramdone": S.done[el.dataset.key] = true; save(); break;
    case "flag": { const id = a.ids[a.idx]; a.flags = a.flags.includes(id) ? a.flags.filter(x => x !== id) : [...a.flags, id]; save(); rerunKeepScroll(); break; }
    case "check": a.checked[a.ids[a.idx]] = true; save(); rerunKeepScroll(); break;
    case "reviewscreen": a.reviewScreen = true; a.confirm = false; save(); route(); scrollTo(0,0); break;
    case "confirm": a.confirm = true; rerunKeepScroll(); break;
    case "unconfirm": a.confirm = false; rerunKeepScroll(); break;
    case "submit": finishAttempt(); break;
    case "abandon": S.active = null; save(); location.hash = "today"; toast("Attempt discarded"); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "pfn") { PF.n = +e.target.value; route(); }
  if (e.target.id === "startDate" && e.target.value) { S.startDate = parseDate(e.target.value); if (S.examDate <= S.startDate) S.examDate = S.startDate + 7*DAY; save(); route(); }
  if (e.target.id === "examDate" && e.target.value) { const v = parseDate(e.target.value); if (v <= S.startDate) { toast("Exam date must be after the start date."); route(); return; } S.examDate = v; save(); route(); toast("Plan re-spread to your exam date"); }
});
document.addEventListener("keydown", e => {
  if (location.hash !== "#run" || !S.active || S.active.reviewScreen || e.target.matches("input,select,textarea")) return;
  const k = e.key.toUpperCase(), i = "ABCDEF".indexOf(k);
  if (i >= 0 && k.length === 1) { const b = document.querySelector(`[data-opt="${i}"]`); if (b && !b.disabled) b.click(); }
  else if (e.key === "ArrowRight") document.querySelector(`[data-go="${S.active.idx+1}"]`)?.click();
  else if (e.key === "ArrowLeft") document.querySelector(`[data-go="${S.active.idx-1}"]`)?.click();
});
window.addEventListener("hashchange", () => { route(); scrollTo(0, 0); });

/* ============ boot ============ */
(async function boot(){
  S = Object.assign(freshState(), loadLocal() || {});
  try {
    const r = await fetch("bank.json"); B = await r.json();
    B.questions.forEach(q => QM[q.id] = q);
  } catch (e) { $("#app").innerHTML = `<div class="empty">The question bank couldn't be loaded. Reload the page to try again.</div>`; return; }
  route();
  connectStore();
})();
</script>
